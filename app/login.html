<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudFlow</title>
    <link rel="stylesheet" href="../pico-daisy.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-mesh);
            background-color: var(--pico-background-color);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: var(--modern-glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--modern-glass-border);
            border-radius: var(--modern-radius-xl);
            padding: 2.5rem;
            box-shadow: var(--modern-shadow-xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--pico-muted-color);
            font-size: 0.9375rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.875rem;
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--modern-radius-md);
            font-weight: 600;
            color: var(--pico-color);
            cursor: pointer;
            transition: all var(--modern-transition-base);
        }

        .social-btn:hover {
            background: var(--modern-gray-50);
            border-color: var(--modern-gray-300);
            transform: translateY(-1px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        .divider-text {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--pico-muted-color);
            font-size: 0.8125rem;
        }

        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--pico-muted-border-color);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--pico-muted-color);
        }

        .form-footer a {
            color: var(--modern-primary);
            font-weight: 500;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }

        [data-theme="dark"] .social-btn:hover {
            background: var(--modern-gray-800);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="landing.html" style="text-decoration: none; color: inherit;">
                    <h1>☁️ CloudFlow</h1>
                </a>
                <p>Sign in to your account</p>
            </div>

            <!-- Google Auth -->
            <button type="button" class="social-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continue with Google
            </button>

            <div class="divider-text">or continue with email</div>

            <!-- Email/Password Form -->
            <form action="dashboard.html" method="get">
                <label for="email">
                    Email
                    <input type="email" id="email" name="email" placeholder="you@example.com" required
                        autocomplete="email">
                </label>

                <label for="password">
                    <span style="display: flex; justify-content: space-between;">
                        Password
                        <a href="#" style="font-size: 0.8125rem;">Forgot password?</a>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </label>

                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="remember" style="width: auto; margin: 0;">
                    <span style="font-size: 0.875rem;">Remember me for 30 days</span>
                </label>

                <button type="submit" class="btn-gradient" style="width: 100%; margin-top: 1rem;">
                    Sign In
                </button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="#">Sign up for free</a>
            </div>
        </div>

        <a href="landing.html" class="back-link">← Back to home</a>
    </div>
</body>

</html>
